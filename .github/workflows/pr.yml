name: PR

on:
  pull_request:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Spec / documentation validation
        run: ./scripts/validate-specs.sh
      - name: Release pipeline gate tests (ANDREL-005/006)
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Unit tests (core JVM + app Robolectric)
        run: |
          ./gradlew -p core test
          ./gradlew :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug

  build-artifact:
    # ANDREL-002 / REL-001 — every PR build produces downloadable APKs.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      # ANDREL-008 — the release gate's parser meets the runner's real apksigner on every PR,
      # so a build-tools format change fails here instead of during a release. The PR APK is
      # debug-signed by design: parse-only mode checks the format, not the certificate, and
      # needs no secrets (ANDREL-006).
      - name: Parse the runner's apksigner output with the release gate (ANDREL-008)
        run: python3 .github/scripts/verify_release_signature.py --parse-only app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: roadtrip-android-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 14
